job_name: codex-hooks-test
jobs_dir: REPLACE_WITH_FIX_CODEX_DIR/jobs

n_attempts: 1

orchestrator:
  type: local
  n_concurrent_trials: 1
  quiet: false

environment:
  type: docker
  force_build: false
  delete: false

agents:
  - name: codex-patched
    import_path: fix_codex.agent:PatchedCodexAgent
    model_name: openai/gpt-5.2-medium
    env:
      V_API_KEY: "REPLACE_WITH_YOUR_API_KEY"
      OPENAI_API_KEY: "REPLACE_WITH_YOUR_API_KEY"
      OPENAI_BASE_URL: "https://api.v3.cm/v1"
      CODEX_HOOKS_CONFIG: "REPLACE_WITH_FIX_CODEX_DIR/example/hooks.json"

tasks:
  - path: REPLACE_WITH_FIX_CODEX_DIR/task_econ_iter0
