job_name: codex-econ-example
jobs_dir: ./jobs   # relative to where you run harbor

n_attempts: 1

orchestrator:
  type: local
  n_concurrent_trials: 1
  quiet: false

environment:
  type: docker
  force_build: false
  delete: false

agents:
  - name: codex-patched
    import_path: fix_codex.agent:PatchedCodexAgent
    model_name: openai/gpt-5.2-medium
    env:
      V_API_KEY: "YOUR_API_KEY_HERE"
      OPENAI_API_KEY: "YOUR_API_KEY_HERE"
      OPENAI_BASE_URL: "https://api.v3.cm/v1"
      # Optional: enable hooks by pointing to a hooks.json on the host
      # CODEX_HOOKS_CONFIG: "/absolute/path/to/hooks.json"

tasks:
  - path: ./task_econ_iter0   # relative path to the task directory
